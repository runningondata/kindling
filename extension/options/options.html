<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kindling Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #333;
      padding: 24px 32px;
      max-width: 560px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #e65100;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    fieldset {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    legend {
      font-weight: 600;
      font-size: 14px;
      padding: 0 6px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .field label {
      flex: 1;
      font-size: 13px;
    }

    .field .desc {
      display: block;
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .field input[type="number"] {
      width: 80px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      text-align: right;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      padding: 8px 18px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #333;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:hover { background: #f5f5f5; }

    .btn.primary {
      background: #e65100;
      color: #fff;
      border-color: #e65100;
    }

    .btn.primary:hover { background: #bf360c; }

    #save-msg {
      margin-left: 12px;
      font-size: 13px;
      color: #2e7d32;
      align-self: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #save-msg.visible { opacity: 1; }
  </style>
</head>
<body>
  <h1>Kindling Options</h1>
  <p class="subtitle">Adjust diagnostic thresholds. Changes apply to the next analysis.</p>

  <fieldset>
    <legend>Skew &amp; Stragglers</legend>

    <div class="field">
      <label>
        Skew threshold (max/p75)
        <span class="desc">Flag skew when Max duration exceeds this multiple of the 75th percentile</span>
      </label>
      <input type="number" id="skewThreshold" step="0.1" min="1">
    </div>

    <div class="field">
      <label>
        Severe skew threshold (max/median)
        <span class="desc">Flag severe skew when Max duration exceeds this multiple of the median</span>
      </label>
      <input type="number" id="severeSkewThreshold" step="0.1" min="1">
    </div>

    <div class="field">
      <label>
        Straggler multiple
        <span class="desc">Flag a task as straggler when its duration exceeds this multiple of the median</span>
      </label>
      <input type="number" id="stragglerMultiple" step="0.5" min="1">
    </div>
  </fieldset>

  <fieldset>
    <legend>GC &amp; Memory</legend>

    <div class="field">
      <label>
        GC pressure threshold
        <span class="desc">Flag when GC time exceeds this fraction of task duration (0.10 = 10%)</span>
      </label>
      <input type="number" id="gcPressureThreshold" step="0.01" min="0" max="1">
    </div>

    <div class="field">
      <label>
        Memory util. warning (fraction)
        <span class="desc">Flag executor memory utilisation above this fraction (0.90 = 90%)</span>
      </label>
      <input type="number" id="memoryUtilWarning" step="0.01" min="0" max="1">
    </div>

    <div class="field">
      <label>
        Memory util. critical (fraction)
        <span class="desc">Critical alert when executor memory exceeds this fraction (0.95 = 95%)</span>
      </label>
      <input type="number" id="memoryUtilCritical" step="0.01" min="0" max="1">
    </div>
  </fieldset>

  <fieldset>
    <legend>Small Tasks</legend>

    <div class="field">
      <label>
        Small task duration (ms)
        <span class="desc">Tasks with median duration below this are considered small</span>
      </label>
      <input type="number" id="smallTaskDurationMs" step="10" min="1">
    </div>

    <div class="field">
      <label>
        Minimum task count
        <span class="desc">Only flag small tasks when total task count exceeds this</span>
      </label>
      <input type="number" id="smallTaskCountMin" step="100" min="1">
    </div>
  </fieldset>

  <fieldset>
    <legend>Executors &amp; Jobs</legend>

    <div class="field">
      <label>
        Executor skew ratio
        <span class="desc">Flag when max/min shuffle read across executors exceeds this ratio</span>
      </label>
      <input type="number" id="executorSkewRatio" step="0.5" min="1">
    </div>

    <div class="field">
      <label>
        Stage time dominance
        <span class="desc">Flag when a stage takes more than this fraction of total job time (0.80 = 80%)</span>
      </label>
      <input type="number" id="stageTimeDominance" step="0.05" min="0" max="1">
    </div>
  </fieldset>

  <fieldset>
    <legend>Small Files</legend>

    <div class="field">
      <label>
        Avg. file size warning (MB)
        <span class="desc">Flag scan as warning when average file size is below this (MB)</span>
      </label>
      <input type="number" id="smallFileAvgSizeWarningMb" step="1" min="1">
    </div>

    <div class="field">
      <label>
        Avg. file size critical (MB)
        <span class="desc">Flag scan as critical when average file size is below this (MB)</span>
      </label>
      <input type="number" id="smallFileAvgSizeCriticalMb" step="0.1" min="0.1">
    </div>

    <div class="field">
      <label>
        Minimum file count
        <span class="desc">Only flag small files when the number of files exceeds this</span>
      </label>
      <input type="number" id="smallFileMinCount" step="10" min="1">
    </div>
  </fieldset>

  <fieldset>
    <legend>Filters &amp; Estimation</legend>

    <div class="field">
      <label>
        Long filter char threshold
        <span class="desc">Flag filter expressions longer than this many characters</span>
      </label>
      <input type="number" id="longFilterCharThreshold" step="50" min="100">
    </div>

    <div class="field">
      <label>
        Long filter predicate threshold
        <span class="desc">Flag filter expressions with more AND/OR predicates than this</span>
      </label>
      <input type="number" id="longFilterPredicateThreshold" step="1" min="1">
    </div>

    <div class="field">
      <label>
        Estimation error warning (multiplier)
        <span class="desc">Flag row estimation errors above this multiplier (e.g. 100 = 100x off)</span>
      </label>
      <input type="number" id="estimationErrorWarning" step="10" min="10">
    </div>

    <div class="field">
      <label>
        Estimation error critical (multiplier)
        <span class="desc">Critical alert for estimation errors above this multiplier</span>
      </label>
      <input type="number" id="estimationErrorCritical" step="100" min="100">
    </div>
  </fieldset>

  <fieldset>
    <legend>Shuffle &amp; Columns</legend>

    <div class="field">
      <label>
        Shuffle write warning (GiB)
        <span class="desc">Flag shuffle write when max exceeds this size in GiB</span>
      </label>
      <input type="number" id="shuffleWriteWarningGib" step="0.5" min="0.1">
    </div>

    <div class="field">
      <label>
        Wide schema column threshold
        <span class="desc">Flag scans reading more columns than this (potential SELECT *)</span>
      </label>
      <input type="number" id="wideSchemaColumnThreshold" step="5" min="5">
    </div>
  </fieldset>

  <div class="actions">
    <button id="save-btn" class="btn primary">Save</button>
    <button id="reset-btn" class="btn">Reset to Defaults</button>
    <span id="save-msg">Saved</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
