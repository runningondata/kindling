name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run build:firefox

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: astral-sh/setup-uv@v5

      - run: npm ci
      - run: npm run build

      - name: Install E2E dependencies
        working-directory: test/e2e
        run: |
          uv sync
          uv run playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: test/e2e
        run: uv run pytest -v
