name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check dependency licenses
        run: npx license-checker-rseidelsohn --onlyAllow 'MIT;MIT-0;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Python-2.0;BlueOak-1.0.0;CC0-1.0;0BSD;Unlicense;CC-BY-3.0;CC-BY-4.0' --excludePackages 'kindling@0.1.0'

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run build:firefox

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: astral-sh/setup-uv@v5

      - run: npm ci
      - run: npm run build

      - name: Install E2E dependencies
        working-directory: test/e2e
        run: |
          uv sync
          uv run playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: test/e2e
        run: uv run pytest -v
