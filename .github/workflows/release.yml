name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:firefox

      - name: Read version from manifest
        id: version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Zip Chrome extension
        run: cd extension && zip -r "../kindling-chrome-v${{ steps.version.outputs.version }}.zip" .

      - name: Zip Firefox extension
        run: cd dist/firefox && zip -r "../../kindling-firefox-v${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "kindling-chrome-v${{ steps.version.outputs.version }}.zip" \
            "kindling-firefox-v${{ steps.version.outputs.version }}.zip" \
            --generate-notes
